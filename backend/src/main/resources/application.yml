server:
  port: ${PORT:8080}

spring:
  application:
    name: tulas-canteen
  datasource:
    # Default: file-based H2 so the app runs with zero setup. Use the "mysql" profile for real deployments.
    url: jdbc:h2:file:./data/tulas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  jackson:
    time-zone: Asia/Kolkata
  mvc:
    async:
      request-timeout: -1

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-tulas-canteen-0123456789abcdef}
    expiry-hours: ${JWT_EXPIRY_HOURS:72}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  zone: Asia/Kolkata
  seed-demo: ${SEED_DEMO:true}
  admin:
    email: ${ADMIN_EMAIL:admin@tulas.local}
    password: ${ADMIN_PASSWORD:Admin@123}
    name: ${ADMIN_NAME:Canteen Admin}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tulas_canteen}?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
