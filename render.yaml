# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# The database is Neon (PostgreSQL); paste its connection string into DATABASE_URL when asked.
services:
  - type: web
    name: tulas-canteen
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string, e.g. postgresql://user:pass@ep-xxx.aws.neon.tech/neondb?sslmode=require
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: TZ
        value: Asia/Kolkata
